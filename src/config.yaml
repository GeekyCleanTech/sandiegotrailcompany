site:
  name: San Diego Trail Company
  site: 'https://www.sandiegotrailcompany.com'
  base: '/'
  trailingSlash: true

  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: San Diego Trail Company – Guided Trail Rides, Ranch Stays & Equine Programs in Poway, CA
    template: '%s | San Diego Trail Company'
  description: "Experience Southern California's backcountry with guided horseback trail rides, boutique ranch stays, kids camps, equine coaching, and horse rescue in Poway, CA. Book your adventure today."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: San Diego Trail Company
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: false
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      # Fallback only. This gtag tag renders ONLY while googleTagManager.id below
      # is empty. Once GTM is configured, GA4 is served from the GTM container
      # instead and this tag is not emitted, so pageviews are never double-counted.
      id: 'G-9WKN8YVVT9'
    googleTagManager:
      # Paste the container ID from tagmanager.google.com (format: GTM-XXXXXXX).
      # Leave empty to disable GTM site-wide; no GTM code is emitted when unset.
      # Before setting this, publish a GA4 Configuration tag for G-9WKN8YVVT9
      # inside the container, or GA4 tracking stops when this goes live.
      id: ''

ui:
  theme: 'light:only'
